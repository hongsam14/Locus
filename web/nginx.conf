server {
  listen 80;
  server_name _;
  # a little over the app's 48 MiB request limit: the app judges the limit and answers its
  # own JSON 413; nginx's 1 MiB default would cut uploads first (U8 Infra §3.2, R-03)
  client_max_body_size 49m;

  # The NFR-4 sizes are gzip sizes, and nginx:alpine leaves gzip off: without this the
  # browser took the JS and CSS whole (V2 review #9). woff2 is compressed already.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Building a world from sources is minutes of LLM work (Emberleaf: 34-59 calls one after
  # another, ~84-150 s): these routes wait 600 s; every other /api route keeps 130 s. A build
  # that outlives even this keeps running on the app, and pressing [build] again answers
  # 409 "already running" rather than starting a second one (U8 review #2, memo 13).
  location ~ ^/api/world/worlds/[^/]+/(build|build/upload|demo/[^/]+/build)$ {
    proxy_pass http://app:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # API → app service (compose network)
  location /api/ {
    proxy_pass http://app:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # One NPC line waits for one LLM call, bounded at ~106s (30s x 3 + two Retry-After
    # waits capped at 8s). The 60s default cut it off with a 504 while the backend still
    # saved the exchange (review U5 #5).
    proxy_read_timeout 130s;
    proxy_send_timeout 130s;
  }

  # Vite names every built file by its content, so a file under /assets/ never changes: cache
  # it for a year without asking again. index.html is not here, so a new build still reaches
  # the browser on its next load. The fonts' many small pieces then come from the cache when
  # a second screen needs them (V2 NFR light R-05).
  location /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html names the current build's files: always ask whether it changed, so a new
  # build reaches the browser on its next load (the client-side routes fall back here too)
  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
  }

  # SPA static assets + client-side routing fallback
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
