# Default `docker compose up -d` brings up the infrastructure tier:
#   neo4j, opensearch, dashboard (OpenSearch Dashboards @ :5601).
# Profiles:
#   - service: production-ish deployment — adds the app (FastAPI) + web (UI).
#       docker compose --profile service up -d --build
#
# First run: ./scripts/setup-volumes.sh  (creates ./data bind-mount dirs)
#            cp env.example .env          (set OPENAI_API_KEY, NEO4J_PASSWORD, ...)
services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.15-community
    container_name: locus-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP browser
      - "7687:7687" # Bolt
    environment:
      # No hardcoded default — must be set in .env (see env.example).
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required (set it in .env)}
      # APOC plugin (auto-downloaded into /plugins on first start)
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - locus-net

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: locus-opensearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true # local dev only (ID-Q2=A)
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      # Sourced from env only (no hardcoded default). The security plugin is
      # disabled above, so a value is not needed for local dev; set it in your
      # (git-ignored) .env if you enable security.
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - locus-net

  # PostgreSQL — game-session layer (S1). Canonical Neo4j/OpenSearch unchanged.
  postgres:
    image: postgres:16-alpine
    container_name: locus-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${SESSION_DB_USER:-locus}
      # No hardcoded default — must be set in .env (see env.example).
      - POSTGRES_PASSWORD=${SESSION_DB_PASSWORD:?SESSION_DB_PASSWORD is required (set it in .env)}
      - POSTGRES_DB=${SESSION_DB_NAME:-locus_session}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SESSION_DB_USER:-locus} -d ${SESSION_DB_NAME:-locus_session}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - locus-net

  # OpenSearch Dashboards (index inspection UI) — http://localhost:5601
  dashboard:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: locus-opensearch-dashboards
    restart: unless-stopped
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - locus-net

  # ---------------------------------------------------------------------------
  # Application (profile: service) — needs OPENAI_API_KEY in .env
  # ---------------------------------------------------------------------------
  app:
    build: .
    container_name: locus-app
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # container-network overrides (take precedence over .env)
      - NEO4J_URI=bolt://neo4j:7687
      - OPENSEARCH_URL=http://opensearch:9200
      - SESSION_DB_URL=postgresql+psycopg://${SESSION_DB_USER:-locus}:${SESSION_DB_PASSWORD:?SESSION_DB_PASSWORD is required (set it in .env)}@postgres:5432/${SESSION_DB_NAME:-locus_session}
    ports:
      - "${API_PORT:-8000}:8000"
    # bootstrap schema (no API key needed) then serve the API
    command: ["sh", "-c", "python -m locus init-schema && uvicorn api.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - locus-net
    profiles:
      - service

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: locus-web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"
    networks:
      - locus-net
    profiles:
      - service

networks:
  locus-net:
    driver: bridge

volumes:
  neo4j_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/neo4j/data
  neo4j_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/neo4j/logs
  neo4j_import:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/neo4j/import
  neo4j_plugins:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/neo4j/plugins
  opensearch_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/opensearch
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/postgres
