[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "locus"
version = "0.1.0"
description = "Spatial Knowledge Graph Builder for Game Worlds — region topology + region-scoped knowledge ontology for NPCs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Locus" }]

dependencies = [
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "neo4j>=5.0.0,<6",
    "opensearch-py>=2.0.0,<3",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langgraph>=0.0.30",
    "openai>=1.0.0",
    "tenacity>=8.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.90.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
locus = "locus.__main__:main"

[tool.setuptools.packages.find]
include = ["locus*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=locus --cov-report=term-missing"
