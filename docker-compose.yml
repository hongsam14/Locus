# Default `docker compose up -d` brings up the infrastructure tier only:
#   neo4j, opensearch.
# Profiles:
#   - tools:   adds OpenSearch Dashboards (index inspection).
#       docker compose --profile tools up -d
#   - service: production-ish deployment — adds the app (FastAPI) + web (UI).
#       docker compose --profile service up -d --build
#
# First run: ./scripts/setup-volumes.sh  (creates ./data bind-mount dirs)
#            cp env.example .env          (set OPENAI_API_KEY, NEO4J_PASSWORD, ...)
services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.15-community
    container_name: locus-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP browser
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-locus-dev-password}
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - locus-net

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: locus-opensearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true # local dev only (ID-Q2=A)
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - locus-net

  # Optional index inspection UI (profile: tools)
  dashboard:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: locus-opensearch-dashboards
    restart: unless-stopped
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - locus-net
    profiles:
      - tools

  # ---------------------------------------------------------------------------
  # Application (profile: service) — needs OPENAI_API_KEY in .env
  # ---------------------------------------------------------------------------
  app:
    build: .
    container_name: locus-app
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # container-network overrides (take precedence over .env)
      - NEO4J_URI=bolt://neo4j:7687
      - OPENSEARCH_URL=http://opensearch:9200
    ports:
      - "${API_PORT:-8000}:8000"
    # bootstrap schema (no API key needed) then serve the API
    command: ["sh", "-c", "python -m locus init-schema && uvicorn api.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - locus-net
    profiles:
      - service

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: locus-web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"
    networks:
      - locus-net
    profiles:
      - service

networks:
  locus-net:
    driver: bridge

volumes:
  neo4j_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/neo4j/data
  neo4j_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/neo4j/logs
  opensearch_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/opensearch
