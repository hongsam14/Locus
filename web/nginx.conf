server {
  listen 80;
  server_name _;

  # API → app service (compose network)
  location /api/ {
    proxy_pass http://app:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # One NPC line waits for one LLM call, bounded at ~106s (30s x 3 + two Retry-After
    # waits capped at 8s). The 60s default cut it off with a 504 while the backend still
    # saved the exchange (review U5 #5).
    proxy_read_timeout 130s;
    proxy_send_timeout 130s;
  }

  # SPA static assets + client-side routing fallback
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
